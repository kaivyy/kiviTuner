name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure single draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const ref = context.ref || '';
            const tag = ref.startsWith('refs/tags/')
              ? ref.slice('refs/tags/'.length)
              : `v${conf.version}`;
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 50,
            });
            const existing = releases.data.find((r) => r.tag_name === tag);
            if (existing) {
              return String(existing.id);
            }
            const created = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `kiviTuner ${tag}`,
              body: 'Cross-platform ECU Calibration & Flashing Workbench installers (.exe, .msi, .deb, .rpm, .AppImage, .dmg).',
              draft: true,
              prerelease: false,
            });
            return String(created.data.id);

  build-tauri:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            bundle_bridge: false
            tauri_args: --target x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows-x64
            bundle_bridge: true
            tauri_args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows-x64.conf.json
          - platform: windows-latest
            target: i686-pc-windows-msvc
            os_name: windows-x86
            bundle_bridge: false
            tauri_args: --target i686-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: macos-arm64
            bundle_bridge: false
            tauri_args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_name: macos-x64
            bundle_bridge: false
            tauri_args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Win32 target for 32-bit J2534 bridge
        if: matrix.bundle_bridge
        run: rustup target add i686-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            rpm \
            libssl-dev \
            libgtk-3-dev \
            libudev-dev \
            pkg-config

      - name: Install frontend dependencies, verify UI & prepare Tauri CLI
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm install --no-save '@tauri-apps/cli@^2'

      - name: Build & bundle 32-bit J2534 bridge companion
        if: matrix.bundle_bridge
        shell: pwsh
        run: |
          cargo build --release --target i686-pc-windows-msvc -p kivi-j2534-bridge
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/i686-pc-windows-msvc/release/kivi-j2534-bridge.exe src-tauri/binaries/kivi-j2534-bridge-x86.exe -Force

      - name: Verify core & flashing crates on target
        if: matrix.platform == 'windows-latest' || matrix.platform == 'ubuntu-22.04' || matrix.os_name == 'macos-arm64'
        run: cargo test --target ${{ matrix.target }} -p kivi-core -p kivi-checksum -p kivi-flashing -p kivi-j2534-bridge

      - name: Configure signed updater config when pubkey secret is present
        id: updater-cfg
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_UPDATER_PUBKEY }}" ]; then
            node -e "
              const fs = require('fs');
              const base = JSON.parse(fs.readFileSync('src-tauri/tauri.updater.conf.json', 'utf8'));
              base.plugins = base.plugins || {};
              base.plugins.updater = base.plugins.updater || {};
              base.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBKEY;
              fs.writeFileSync('src-tauri/tauri.updater.generated.conf.json', JSON.stringify(base, null, 2));
            "
            echo "extra_args=--config src-tauri/tauri.updater.generated.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}

      - name: Build Tauri bundle & upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tauriScript: npx tauri
          args: ${{ matrix.tauri_args }} ${{ steps.updater-cfg.outputs.extra_args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kivituner-${{ matrix.os_name }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz

  publish-release:
    needs: [prepare-release, build-tauri]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts & generate SHA256SUMS.txt
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload SHA256SUMS.txt and publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const lines = [];
            function walk(dir) {
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(full);
                else if (ent.isFile() && ent.name !== 'SHA256SUMS.txt') {
                  const hash = crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex');
                  lines.push(`${hash}  ${ent.name}`);
                }
              }
            }
            walk('release-artifacts');
            const sums = lines.sort().join('\n') + '\n';
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              name: 'SHA256SUMS.txt',
              data: sums,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            });
